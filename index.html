<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AD&D Fireball Tool</title>
    <style>
        body {
            font-family: sans-serif;
            background: #242424;
            color: #white;
            padding: 10px;
        }
        button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background: #444;
            color: #fff;
            border: 1px solid #666;
            cursor: pointer;
        }
        button:hover { background: #555; }
    </style>
    <!-- Подключаем SDK Owlbear Rodeo напрямую из сети -->
    <script src="https://unpkg.com/@owlbear-rodeo/sdk"></script>
</head>
<body>
    <h3>Физика Фаербола 2е</h3>
    <button id="btn-wall">Рисовать стены</button>
    <button id="btn-height">Задать высоту потолка</button>
    <button id="btn-fireball">Кастануть Фаербол</button>

    <script>
        // Проверяем, что SDK загрузился и плагин инициализирован в комнате
        OBR.onReady(() => {
            console.log("Плагин Фаербола успешно запущен внутри Owlbear Rodeo!");
            
            document.getElementById('btn-wall').addEventListener('click', () => {
                alert('Режим рисования стен активирован (код логики будет тут)');
            });
        });
    </script>
</body>
</html>
