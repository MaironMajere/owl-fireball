<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AD&D 2e Fireball Calculator</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 10px; margin: 0; }
        h3 { color: #ff5500; margin-top: 0; text-align: center; font-size: 16px; }
        .fieldset { border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #1a1a1a; }
        .legend { font-weight: bold; color: #ff5500; margin-bottom: 8px; font-size: 12px; text-transform: uppercase; }
        label { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 13px; }
        input { width: 60px; background: #333; color: #fff; border: 1px solid #555; padding: 4px; border-radius: 4px; text-align: center; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 5px; }
        button { padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
        button:hover { background: #444; }
        button.active { background: #ff5500; border-color: #ffaa00; }
        .cast-btn { width: 100%; padding: 10px; background: #e64a19; color: white; border: none; font-size: 14px; margin-top: 5px; }
        .cast-btn:hover { background: #ff5722; }
        .clear-btn { width: 100%; padding: 8px; background: #b71c1c; color: white; border: none; font-size: 12px; margin-top: 5px; }
        .clear-btn:hover { background: #d32f2f; }
        #status { font-size: 11px; color: #00ff66; margin-top: 8px; text-align: center; min-height: 14px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <h3>AD&D 2e Fireball 3D Pro</h3>
    
    <div class="fieldset">
        <div class="legend">1. Разметка геометрии</div>
        <div class="btn-group">
            <button id="btn-wall" onclick="toggleTool('wall')">Стена / Колонна</button>
            <button id="btn-zone" onclick="toggleTool('zone')">Задать Зону</button>
        </div>
        <div id="zone-inputs" style="display: none; border-top: 1px solid #333; margin-top: 8px; padding-top: 4px;">
            <label>Высота потолка (фт): <input type="number" id="geo-ceiling" value="10"></label>
            <label>Высота пола/ямы (фт): <input type="number" id="geo-floor" value="0"></label>
        </div>
    </div>

    <div class="fieldset">
        <div class="legend">2. Детонация</div>
        <label>Высота взрыва от пола (фт): <input type="number" id="cast-height" value="5"></label>
        <button class="cast-btn" id="cast-btn">КАСТОВАТЬ ФАЕРБОЛ</button>
    </div>

    <button id="clear-btn" class="clear-btn">Очистить карту</button>
    <div id="status">Загрузка...</div>
</body>
</html>
