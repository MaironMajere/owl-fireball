<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AD&D 2e Fireball Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            background: #242424;
            color: #fff;
            padding: 10px;
            margin: 0;
        }
        h3 { margin-top: 0; color: #ff4500; text-align: center; }
        .control-group {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { font-size: 13px; }
        input {
            width: 70px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #ff4500;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #e03e00; }
        #output {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>AD&D 2e Fireball</h3>
    
    <div class="control-group">
        <label>Высота потолка (футы):</label>
        <input type="number" id="ceiling" value="10" min="1">
    </div>
    
    <div class="control-group">
        <label>Глубина пола/ям (футы):</label>
        <input type="number" id="floor" value="0" min="0">
    </div>

    <div class="control-group">
        <label>Высота эпицентра (от пола):</label>
        <input type="number" id="epicenter-height" value="5" min="0">
    </div>

    <button id="calc-btn">Рассчитать и нарисовать</button>
    <div id="output">Готов к детонации</div>

    <!-- Подключаем SDK Оулбира и наш скрипт логики -->
    <script src="https://unpkg.com/@owlbear-rodeo/sdk"></script>
    <script src="script.js"></script>
</body>
</html>
