<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AD&D 2e Fireball Calculator</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 10px; margin: 0; }
        h3 { color: #ff5500; margin-top: 0; }
        .fieldset { border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .legend { font-weight: bold; color: #aaa; margin-bottom: 5px; }
        label { display: block; margin: 5px 0; font-size: 13px; }
        input { width: 60px; background: #333; color: #fff; border: 1px solid #555; padding: 4px; border-radius: 4px; text-align: center; }
        button { width: 100%; padding: 10px; background: #ff5500; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background: #ff7722; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        #status { font-size: 12px; color: #00ff66; margin-top: 8px; min-height: 16px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <h3>AD&D 2e Fireball 3D Pro</h3>
    
    <div class="fieldset">
        <div class="legend">1. Инструменты разметки (в панели совы)</div>
        <p style="font-size: 11px; color: #bbb; margin: 5px 0;">Инструменты «Кисть» и «Зона» появятся в левой панели Owlbear Rodeo при запуске плагина.</p>
        <label>Высота потолка зоны (футы): <input type="number" id="geo-ceiling" value="10"></label>
        <label>Глубина пола/ямы (футы): <input type="number" id="geo-floor" value="0"></label>
    </div>

    <div class="fieldset">
        <div class="legend">2. Детонация</div>
        <label>Высота эпицентра от пола (футы): <input type="number" id="cast-height" value="5"></label>
        <button id="cast-btn">💥 КАСТОВАТЬ ФАЕРБОЛ</button>
    </div>

    <button id="clear-btn" class="secondary">Очистить эффекты и разметку</button>
    <div id="status">Инициализация...</div>
</body>
</html>
